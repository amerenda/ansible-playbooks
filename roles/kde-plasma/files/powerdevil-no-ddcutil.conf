[Service]
# Officially documented workaround (powerdevil README) for a confirmed real
# bug: powerdevil's own display re-detection cycle after DPMS-off wakes the
# screen back up (ddcutil's recently_resumed_from_sleep_by_clocktime
# false-positive is one trigger of this; disabling ddcutil removes that
# specific trigger).
Environment=POWERDEVIL_NO_DDCUTIL=1
