---
# Role: kde-plasma
# Installs KDE Plasma 6 + SDDM and enables audio/display services.
# plasma-meta and sddm are already in cachyos_pacman_packages (installed by common role).

# CachyOS ships its own display manager, plasma-login-manager (plasmalogin.service), enabled
# by default instead of sddm.service — they both want to own
# /etc/systemd/system/display-manager.service, so forcing sddm on top of an already-working
# plasmalogin fails ("File ... already exists and is a symlink to ... plasmalogin.service").
# Converge instead of fight the distro default: only enable sddm as a fallback if no display
# manager is enabled yet; leave an already-working one (plasmalogin or otherwise) alone.
- name: Check which display manager is currently enabled
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: cachyos_display_manager_link
  tags: [kde, sddm]

- name: Enable SDDM display manager (only if no display manager is enabled yet)
  ansible.builtin.systemd:
    name: sddm
    enabled: true
    state: started
  when: not cachyos_display_manager_link.stat.exists
  tags: [kde, sddm]

- name: Enable avahi mDNS daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started
  tags: [kde, avahi]

- name: Ensure /etc/sddm.conf.d exists
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [kde, sddm]

- name: Configure SDDM to use Wayland session
  ansible.builtin.copy:
    content: |
      [Autologin]
      Session=plasma.desktop

      [General]
      DisplayServer=wayland
      GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

      [Wayland]
      SessionDir=/usr/share/wayland-sessions
    dest: /etc/sddm.conf.d/kde_settings.conf
    owner: root
    group: root
    mode: "0644"
  tags: [kde, sddm, wayland]

- name: Ensure plasmalogin .config directory exists
  ansible.builtin.file:
    path: /var/lib/plasmalogin/.config
    state: directory
    owner: plasmalogin
    group: plasmalogin
    mode: "0700"
  tags: [kde, plasmalogin, display]

- name: Deploy kwinoutputconfig.json for plasmalogin greeter
  ansible.builtin.copy:
    src: plasmalogin-kwinoutputconfig.json
    dest: /var/lib/plasmalogin/.config/kwinoutputconfig.json
    owner: plasmalogin
    group: plasmalogin
    mode: "0644"
  tags: [kde, plasmalogin, display]

- name: Set KDE dark theme via kwriteconfig6
  ansible.builtin.shell: |
    kwriteconfig6 --file kdeglobals --group General --key ColorScheme BreezeDark
    kwriteconfig6 --file kdeglobals --group KDE --key widgetStyle Breeze
    kwriteconfig6 --file plasmarc --group Theme --key name breeze-dark
  become: false
  args:
    executable: /bin/bash
  changed_when: false
  tags: [kde, theme]

# ── DPMS sleep fix ─────────────────────────────────────────────────────────
#
# Confirmed root causes (2026-08-22 investigation) of "monitor sleeps then
# instantly wakes":
#
# 1) A real KWin bug (matches reports from other AMDGPU/Wayland dual-output
#    users, e.g. r/kde "Wayland KWin constantly waking monitor from sleep"):
#    if KWin's *enabled-output count* ever drops to zero, it force-restores
#    every output as DPMS-On the moment any output reappears. On this box,
#    joystick-notify's force-desk-primary.sh fully `disable`s the couch TV
#    output whenever we're in desk mode -- so the desk monitor is the only
#    enabled output, and DPMS-off on it alone drops the count to zero,
#    tripping the bug. Confirmed live: with only the desk monitor enabled,
#    every DPMS-off woke itself back up within 5-20s; with the TV output
#    also kept enabled (blanked, non-primary, priority 2), a DPMS-off held
#    for 4+ minutes with none of the "no outputs - creating placeholder
#    screen" / redetection log lines that preceded every previous wake.
#
#    output-topology-guard.service is the fix: it does NOT touch DPMS state
#    (so it cannot cause the flicker an earlier reactive DPMS-reassert
#    attempt did -- see git history for that dead end). It only watches
#    output *topology* every 15s and re-enables the TV output if it finds
#    it disabled. Topology only changes on login or couch/desk mode
#    switches, not on every idle cycle, so this fires rarely. It
#    deliberately does not modify joystick-notify or force-desk-primary.sh
#    (which is what disables the TV output in the first place) -- it's a
#    separate, independent corrective pass layered on top.
#
# 2) A config bug that was making (1) look worse than it needed to:
#    DimDisplayIdleTimeoutSec was set to 2147483647 (INT32_MAX seconds) to
#    mean "never dim", but powerdevil converts this to milliseconds
#    internally, overflowing 32-bit int range and producing
#    "KIdleTime::addIdleTimeout: invalid timeout: -1000" in the log --
#    which was driving a continuous ~10s output-redetection storm
#    independent of any real DPMS event. 0 is the correct "disabled"
#    sentinel for this field, not INT32_MAX.
#
# POWERDEVIL_NO_DDCUTIL=1 (no-ddcutil.conf) is kept as defense-in-depth: a
# separate, real, documented powerdevil bug (ddcutil's
# recently_resumed_from_sleep_by_clocktime false-positive) that's a-priori
# unrelated to (1) but harmless to disable and removes one more thing that
# can reset brightness/wake a display after DPMS-off.

- name: DPMS sleep fix (only on hosts with dpms_sleep_fix_desk_connector set, e.g. archlinux)
  when: dpms_sleep_fix_desk_connector is defined
  tags: [kde, dpms-sleep-fix]
  block:
    - name: Remove earlier dead-end fix (dpms-sleep-fix.sh reactive DPMS-reassert loop)
      ansible.builtin.systemd:
        scope: user
        name: dpms-sleep-fix.service
        state: stopped
        enabled: false
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
      failed_when: false

    - name: Remove earlier dead-end fix files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cachyos_user_home }}/.config/systemd/user/dpms-sleep-fix.service"
        - "{{ cachyos_user_home }}/.config/systemd/user/graphical-session.target.wants/dpms-sleep-fix.service"
        - "{{ cachyos_user_home }}/.config/systemd/user/plasma-powerdevil.service.d/debug-logging.conf"
        - /usr/local/bin/dpms-sleep-fix.sh

    - name: Deploy output-topology-guard.sh
      ansible.builtin.template:
        src: output-topology-guard.sh.j2
        dest: /usr/local/bin/output-topology-guard.sh
        owner: root
        group: root
        mode: "0755"

    - name: Ensure plasma-powerdevil.service.d drop-in directory exists
      ansible.builtin.file:
        path: "{{ cachyos_user_home }}/.config/systemd/user/plasma-powerdevil.service.d"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      become: false

    - name: Deploy plasma-powerdevil.service.d drop-in (no-ddcutil)
      ansible.builtin.copy:
        src: powerdevil-no-ddcutil.conf
        dest: "{{ cachyos_user_home }}/.config/systemd/user/plasma-powerdevil.service.d/no-ddcutil.conf"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      become: false
      register: dpms_powerdevil_dropins

    - name: Deploy output-topology-guard.service (systemd --user unit)
      ansible.builtin.copy:
        src: output-topology-guard.service
        dest: "{{ cachyos_user_home }}/.config/systemd/user/output-topology-guard.service"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      become: false

    - name: Set DimDisplayIdleTimeoutSec to 0 (disabled) instead of overflowing INT32_MAX
      ansible.builtin.shell: kwriteconfig6 --file powerdevilrc --group AC --group Display --key DimDisplayIdleTimeoutSec 0
      become: false
      changed_when: false

    - name: Set TurnOffDisplayIdleTimeoutSec to 45 minutes
      ansible.builtin.shell: kwriteconfig6 --file powerdevilrc --group AC --group Display --key TurnOffDisplayIdleTimeoutSec 2700
      become: false
      changed_when: false

    - name: Reload systemd --user units
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"

    - name: Enable and start output-topology-guard.service
      ansible.builtin.systemd:
        scope: user
        name: output-topology-guard.service
        enabled: true
        state: started
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"

    - name: Restart powerdevil to pick up drop-ins and settings (only if something changed)
      ansible.builtin.systemd:
        scope: user
        name: plasma-powerdevil.service
        state: restarted
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
      when: dpms_powerdevil_dropins.changed
