---
# Role: kde-plasma
# Installs KDE Plasma 6 + SDDM and enables audio/display services.
# plasma-meta and sddm are already in cachyos_pacman_packages (installed by common role).

# CachyOS ships its own display manager, plasma-login-manager (plasmalogin.service), enabled
# by default instead of sddm.service — they both want to own
# /etc/systemd/system/display-manager.service, so forcing sddm on top of an already-working
# plasmalogin fails ("File ... already exists and is a symlink to ... plasmalogin.service").
# Converge instead of fight the distro default: only enable sddm as a fallback if no display
# manager is enabled yet; leave an already-working one (plasmalogin or otherwise) alone.
- name: Check which display manager is currently enabled
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: cachyos_display_manager_link
  tags: [kde, sddm]

- name: Enable SDDM display manager (only if no display manager is enabled yet)
  ansible.builtin.systemd:
    name: sddm
    enabled: true
    state: started
  when: not cachyos_display_manager_link.stat.exists
  tags: [kde, sddm]

- name: Enable avahi mDNS daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started
  tags: [kde, avahi]

- name: Ensure /etc/sddm.conf.d exists
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [kde, sddm]

- name: Configure SDDM to use Wayland session
  ansible.builtin.copy:
    content: |
      [Autologin]
      Session=plasma.desktop

      [General]
      DisplayServer=wayland
      GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

      [Wayland]
      SessionDir=/usr/share/wayland-sessions
    dest: /etc/sddm.conf.d/kde_settings.conf
    owner: root
    group: root
    mode: "0644"
  tags: [kde, sddm, wayland]

- name: Ensure plasmalogin .config directory exists
  ansible.builtin.file:
    path: /var/lib/plasmalogin/.config
    state: directory
    owner: plasmalogin
    group: plasmalogin
    mode: "0700"
  tags: [kde, plasmalogin, display]

- name: Deploy kwinoutputconfig.json for plasmalogin greeter
  ansible.builtin.copy:
    src: plasmalogin-kwinoutputconfig.json
    dest: /var/lib/plasmalogin/.config/kwinoutputconfig.json
    owner: plasmalogin
    group: plasmalogin
    mode: "0644"
  tags: [kde, plasmalogin, display]

- name: Set KDE dark theme via kwriteconfig6
  ansible.builtin.shell: |
    kwriteconfig6 --file kdeglobals --group General --key ColorScheme BreezeDark
    kwriteconfig6 --file kdeglobals --group KDE --key widgetStyle Breeze
    kwriteconfig6 --file plasmarc --group Theme --key name breeze-dark
  become: false
  args:
    executable: /bin/bash
  changed_when: false
  tags: [kde, theme]

# ── DPMS sleep fix ─────────────────────────────────────────────────────────
#
# Confirmed root causes (2026-08-22 investigation) of "monitor sleeps then
# instantly wakes":
#
# 1) A real KWin bug (matches reports from other AMDGPU/Wayland dual-output
#    users, e.g. r/kde "Wayland KWin constantly waking monitor from sleep"):
#    if KWin's *enabled-output count* ever drops to zero, it force-restores
#    every output as DPMS-On the moment any output reappears. On this box,
#    joystick-notify's force-desk-primary.sh fully `disable`s the couch TV
#    output whenever we're in desk mode -- so the desk monitor is the only
#    enabled output, and DPMS-off on it alone drops the count to zero,
#    tripping the bug. Confirmed live: with only the desk monitor enabled,
#    every DPMS-off woke itself back up within 5-20s; with the TV output
#    also kept enabled (blanked, non-primary, priority 2), a DPMS-off held
#    for 4+ minutes with none of the "no outputs - creating placeholder
#    screen" / redetection log lines that preceded every previous wake.
#
#    output-topology-guard.service is the fix: it does NOT touch DPMS state
#    (so it cannot cause the flicker an earlier reactive DPMS-reassert
#    attempt did -- see git history for that dead end). It only watches
#    output *topology* every 15s and re-enables the TV output if it finds
#    it disabled. Topology only changes on login or couch/desk mode
#    switches, not on every idle cycle, so this fires rarely. It
#    deliberately does not modify joystick-notify or force-desk-primary.sh
#    (which is what disables the TV output in the first place) -- it's a
#    separate, independent corrective pass layered on top.
#
# 2) A config bug that was making (1) look worse than it needed to:
#    DimDisplayIdleTimeoutSec was set to 2147483647 (INT32_MAX seconds) to
#    mean "never dim", but powerdevil converts this to milliseconds
#    internally, overflowing 32-bit int range and producing
#    "KIdleTime::addIdleTimeout: invalid timeout: -1000" in the log --
#    which was driving a continuous ~10s output-redetection storm
#    independent of any real DPMS event. 0 is the correct "disabled"
#    sentinel for this field, not INT32_MAX.
#
# POWERDEVIL_NO_DDCUTIL=1 (no-ddcutil.conf) is kept as defense-in-depth: a
# separate, real, documented powerdevil bug (ddcutil's
# recently_resumed_from_sleep_by_clocktime false-positive) that's a-priori
# unrelated to (1) but harmless to disable and removes one more thing that
# can reset brightness/wake a display after DPMS-off.

- name: DPMS sleep fix (only on hosts with dpms_sleep_fix_desk_connector set, e.g. archlinux)
  when: dpms_sleep_fix_desk_connector is defined
  tags: [kde, dpms-sleep-fix]
  block:
    - name: Remove earlier dead-end fix (dpms-sleep-fix.sh reactive DPMS-reassert loop)
      ansible.builtin.systemd:
        scope: user
        name: dpms-sleep-fix.service
        state: stopped
        enabled: false
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
      failed_when: false

    - name: Remove earlier dead-end fix files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cachyos_user_home }}/.config/systemd/user/dpms-sleep-fix.service"
        - "{{ cachyos_user_home }}/.config/systemd/user/graphical-session.target.wants/dpms-sleep-fix.service"
        - "{{ cachyos_user_home }}/.config/systemd/user/plasma-powerdevil.service.d/debug-logging.conf"
        - /usr/local/bin/dpms-sleep-fix.sh

    # 2026-08-27: found an even older, never-ansible-tracked enforcer
    # (predates this whole DPMS block) still installed and still firing on
    # every graphical session start. It force-writes its own hardcoded
    # powerdevilrc -- including DimDisplayIdleTimeoutSec=2147483647, the
    # exact INT32_MAX overflow bug root-caused and fixed above -- silently
    # undoing this role's kwriteconfig6 tasks below on every login. This is
    # what brought the monitor-sleep bug back after PR #69 already fixed it.
    - name: Stop and disable stale powerdevil-settings-enforce.service
      ansible.builtin.systemd:
        scope: user
        name: powerdevil-settings-enforce.service
        state: stopped
        enabled: false
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
      failed_when: false

    - name: Remove stale powerdevil-settings-enforce files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cachyos_user_home }}/.config/systemd/user/powerdevil-settings-enforce.service"
        - "{{ cachyos_user_home }}/.config/systemd/user/graphical-session.target.wants/powerdevil-settings-enforce.service"
        - /usr/local/bin/powerdevil-settings-enforce.sh

    - name: Deploy output-topology-guard.sh
      ansible.builtin.template:
        src: output-topology-guard.sh.j2
        dest: /usr/local/bin/output-topology-guard.sh
        owner: root
        group: root
        mode: "0755"

    - name: Ensure plasma-powerdevil.service.d drop-in directory exists
      ansible.builtin.file:
        path: "{{ cachyos_user_home }}/.config/systemd/user/plasma-powerdevil.service.d"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      become: false

    - name: Deploy plasma-powerdevil.service.d drop-in (no-ddcutil)
      ansible.builtin.copy:
        src: powerdevil-no-ddcutil.conf
        dest: "{{ cachyos_user_home }}/.config/systemd/user/plasma-powerdevil.service.d/no-ddcutil.conf"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      become: false
      register: dpms_powerdevil_dropins

    - name: Deploy output-topology-guard.service (systemd --user unit)
      ansible.builtin.copy:
        src: output-topology-guard.service
        dest: "{{ cachyos_user_home }}/.config/systemd/user/output-topology-guard.service"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      become: false

    - name: Set DimDisplayIdleTimeoutSec to 0 (disabled) instead of overflowing INT32_MAX
      ansible.builtin.shell: kwriteconfig6 --file powerdevilrc --group AC --group Display --key DimDisplayIdleTimeoutSec 0
      become: false
      changed_when: false

    - name: Set TurnOffDisplayIdleTimeoutSec to 45 minutes
      ansible.builtin.shell: kwriteconfig6 --file powerdevilrc --group AC --group Display --key TurnOffDisplayIdleTimeoutSec 2700
      become: false
      changed_when: false

    - name: Reload systemd --user units
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"

    - name: Enable and start output-topology-guard.service
      ansible.builtin.systemd:
        scope: user
        name: output-topology-guard.service
        enabled: true
        state: started
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"

    - name: Restart powerdevil to pick up drop-ins and settings (only if something changed)
      ansible.builtin.systemd:
        scope: user
        name: plasma-powerdevil.service
        state: restarted
      become: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
      when: dpms_powerdevil_dropins.changed

# ── Power management (screen-off timer) ─────────────────────────────────────
#
# Codifies the "turn the monitor off after N minutes idle" setting so it
# survives a reinstall instead of only existing as live, untracked state in
# ~/.config/powerdevilrc. Values come from group_vars so they're tunable per
# host without editing this role.
#
# Skipped on hosts covered by the DPMS sleep fix block above (archlinux):
# that block already owns TurnOffDisplayIdleTimeoutSec (set to 45min, the
# value the 2026-08-22 investigation confirmed avoids the KWin zero-output
# wake bug) and DimDisplayIdleTimeoutSec (the INT32_MAX overflow fix). Two
# independent kwriteconfig6 tasks both writing this file would just race to
# decide the final value on every run.

- name: Configure display power-off idle timeouts via kwriteconfig6
  when: dpms_sleep_fix_desk_connector is not defined
  ansible.builtin.shell: |
    kwriteconfig6 --file powerdevilrc --group "AC][Display" --key TurnOffDisplayIdleTimeoutSec {{ kde_display_off_idle_timeout_sec }}
    kwriteconfig6 --file powerdevilrc --group "AC][Display" --key TurnOffDisplayIdleTimeoutWhenLockedSec {{ kde_display_off_idle_timeout_locked_sec }}
  become: false
  args:
    executable: /bin/bash
  changed_when: false
  notify: Restart powerdevil
  tags: [kde, power]

# ── Powerdevil self-heal (periodic refresh) ──────────────────────────────────
#
# Powerdevil tracks connected displays via libddcutil/DDC-CI polling to drive
# its idle-timeout screen-off feature. Repeated output enable/disable cycles
# (e.g. joystick-notify's couch<->desk display switching, or manual
# `kscreen-doctor` testing) have been observed to leave that internal
# display-watch state confused, silently breaking the screen-off timeout
# until powerdevil is restarted — the config above stays correct throughout,
# only the running daemon's tracking drifts. This periodic timer is a cheap,
# low-risk defensive restart (observed to take ~3s with no visible session
# disruption) rather than trying to detect the drift itself. Skips the
# restart while joystick-notify's couch-mode session is active (checked via
# its owner-lock file) purely out of caution, even though a powerdevil
# restart has not been observed to disrupt an active session.

- name: Ensure user systemd directory exists (for powerdevil-refresh timer)
  ansible.builtin.file:
    path: "{{ cachyos_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0755"
  become: false
  tags: [kde, power]

- name: Install powerdevil-refresh.service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Restart Powerdevil to clear stale DDC/CI display-watch state (see roles/kde-plasma)

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/bash -c '[ -e /tmp/joystick-notify/locks/owner.lock ] && exit 0; exec systemctl --user restart plasma-powerdevil.service'
    dest: "{{ cachyos_user_home }}/.config/systemd/user/powerdevil-refresh.service"
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0644"
  become: false
  notify: Reload user systemd daemon
  tags: [kde, power]

- name: Install powerdevil-refresh.timer
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Periodic Powerdevil refresh (see powerdevil-refresh.service)

      [Timer]
      OnBootSec=15min
      OnUnitActiveSec={{ kde_powerdevil_refresh_interval }}
      AccuracySec=5min

      [Install]
      WantedBy=timers.target
    dest: "{{ cachyos_user_home }}/.config/systemd/user/powerdevil-refresh.timer"
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0644"
  become: false
  notify: Reload user systemd daemon
  tags: [kde, power]

- name: Enable powerdevil-refresh.timer
  ansible.builtin.systemd:
    name: powerdevil-refresh.timer
    enabled: true
    state: started
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [kde, power]

# ── USB remote-wakeup (wake from suspend via Bluetooth adapter) ─────────────
#
# By default the kernel leaves USB remote-wakeup disabled for most devices.
# The xHCI host controller (0000:00:14.0) is already an enabled ACPI wake
# source (see `cat /proc/acpi/wakeup`) — the missing piece is enabling
# wakeup on the Bluetooth adapter itself so a paired device's activity can
# signal the (already wake-capable) host controller to resume.
#
# Matched generically by USB device class (0xe0/0x01/0x01 = Wireless
# Controller / RF Controller / Bluetooth), not by vendor/product ID, so this
# rule keeps working if the adapter is ever swapped for a different model —
# same principle as the vendor/name-based matching used for controller
# detection in the joystick-notify repo.
#
# Note: this only covers a true Bluetooth-paired controller. The Steam
# Controller's USB "Puck" receiver already reports power/wakeup=enabled by
# default (confirmed on this host) with no rule needed — Valve's receiver
# firmware supports remote-wakeup out of the box, which is a known,
# intentional feature distinct from the hotplug-notification gap that
# joystick-notify's controller-liveness-watch.py works around.

- name: Install udev rule enabling USB remote-wakeup on Bluetooth adapters
  ansible.builtin.copy:
    content: |
      # Enable USB remote-wakeup for any Bluetooth adapter (matched by USB
      # device class, not vendor/product ID) so a paired device's activity
      # can wake the host from suspend via the xHCI controller.
      # Installed by roles/kde-plasma (see tasks/main.yml).
      ACTION=="add", SUBSYSTEM=="usb", ATTR{bDeviceClass}=="e0", ATTR{bDeviceSubClass}=="01", ATTR{bDeviceProtocol}=="01", ATTR{power/wakeup}="enabled"
    dest: /etc/udev/rules.d/99-bluetooth-wakeup.rules
    owner: root
    group: root
    mode: "0644"
  tags: [kde, power, bluetooth]

- name: Apply udev rule immediately (re-trigger existing Bluetooth USB devices)
  ansible.builtin.shell: |
    udevadm control --reload-rules
    udevadm trigger --action=add --subsystem-match=usb
  changed_when: false
  tags: [kde, power, bluetooth]
