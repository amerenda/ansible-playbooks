---
# Role: hardware-tweaks
# Machine-specific hardware configuration for the archlinux/CachyOS workstation:
#   - audio-tweaks.service (RTC/HPET max user freq for low-latency audio)
#   - hdmi-edid-override.service (EDID injection for TV/receiver with no DDC at boot)
#   - keyd capslock→esc remap
#   - udev rules: ethernet power-save disable, 8BitDo controller fixes

# ── Audio tweaks ───────────────────────────────────────────────────────────────

- name: Install audio-tweaks.service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Set max user frequency for RTC and HPET
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo 2048 > /sys/class/rtc/rtc0/max_user_freq'
      ExecStart=/bin/sh -c 'echo 2048 > /proc/sys/dev/hpet/max-user-freq'
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/audio-tweaks.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
  tags: [hardware-tweaks, audio]

- name: Enable audio-tweaks service
  ansible.builtin.systemd:
    name: audio-tweaks
    enabled: true
    state: started
  tags: [hardware-tweaks, audio]

# ── EDID firmware files ────────────────────────────────────────────────────────

- name: Ensure /lib/firmware/edid exists
  ansible.builtin.file:
    path: /lib/firmware/edid
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardware-tweaks, edid]

- name: Install TV EDID override (HDMI-A-1 — receiver with no DDC at boot)
  ansible.builtin.copy:
    content: "{{ edid_tv_bin | b64decode }}"
    dest: /lib/firmware/edid/tv.bin
    owner: root
    group: root
    mode: "0644"
  tags: [hardware-tweaks, edid]

- name: Install Samsung Q800T EDID
  ansible.builtin.copy:
    content: "{{ edid_samsung_q800t | b64decode }}"
    dest: /lib/firmware/edid/samsung-q800t-hdmi2.1
    owner: root
    group: root
    mode: "0644"
  tags: [hardware-tweaks, edid]

- name: Install Dell UP2718Q EDID
  ansible.builtin.copy:
    content: "{{ edid_dell_up2718q | b64decode }}"
    dest: /lib/firmware/edid/dell-up2718q-dp
    owner: root
    group: root
    mode: "0644"
  tags: [hardware-tweaks, edid]

# ── HDMI EDID override service ─────────────────────────────────────────────────

- name: Install hdmi-edid-override.service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Inject EDID override + force YUV420 for HDMI-A-1 (TV/receiver presents no DDC at boot; inline CEC dongle can't carry 4K60 at full chroma)
      After=sys-kernel-debug.mount systemd-udev-settle.service

      [Service]
      Type=oneshot
      # force_yuv420_output: confirmed live 2026-08-29 -- the Pulse-Eight
      # CEC dongle sitting inline in the video path (GPU -> dongle ->
      # receiver -> TV) can't carry 3840x2160@60 at the driver's default
      # (higher-bandwidth) chroma/bit-depth negotiation, even though the
      # TV's own real EDID legitimately advertises 4K60 support -- the
      # forced/injected EDID has no way to represent the dongle's own
      # separate bandwidth ceiling. Forcing 4:2:0 chroma roughly halves
      # required bandwidth and gets a real picture through at full
      # resolution/refresh. Confirmed to persist across the daemon's own
      # `udevadm trigger --action=change` connector rescans, so this only
      # needs to be set once here, not re-applied per activation.
      ExecStart=/bin/sh -c '\
        cp /lib/firmware/edid/tv.bin /sys/kernel/debug/dri/1/HDMI-A-1/edid_override && \
        echo on > /sys/kernel/debug/dri/1/HDMI-A-1/force && \
        echo 1 > /sys/kernel/debug/dri/1/HDMI-A-1/force_yuv420_output && \
        echo 1 > /sys/kernel/debug/dri/1/HDMI-A-1/trigger_hotplug'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/hdmi-edid-override.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
  tags: [hardware-tweaks, edid]

- name: Enable hdmi-edid-override service
  ansible.builtin.systemd:
    name: hdmi-edid-override
    enabled: true
    state: started
  tags: [hardware-tweaks, edid]

# ── keyd config ────────────────────────────────────────────────────────────────

- name: Ensure /etc/keyd exists
  ansible.builtin.file:
    path: /etc/keyd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [hardware-tweaks, keyd]

- name: Install keyd default config (capslock → esc)
  ansible.builtin.copy:
    content: |
      [ids]
      *

      [main]
      capslock = esc
    dest: /etc/keyd/default.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart keyd
  tags: [hardware-tweaks, keyd]

- name: Enable keyd service
  ansible.builtin.systemd:
    name: keyd
    enabled: true
    state: started
  tags: [hardware-tweaks, keyd]

# ── Custom udev rules ──────────────────────────────────────────────────────────

- name: Install ethernet power-save disable rule
  ansible.builtin.copy:
    src: 10-network-powersave.rules
    dest: /etc/udev/rules.d/10-network-powersave.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  tags: [hardware-tweaks, udev]

- name: Install USB hub autosuspend disable rule (keyboard/mouse receiver hub)
  ansible.builtin.copy:
    src: 11-usb-hub-powersave.rules
    dest: /etc/udev/rules.d/11-usb-hub-powersave.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  tags: [hardware-tweaks, udev]

- name: Install 8BitDo controller udev rules
  ansible.builtin.copy:
    src: 98-local-8bitdo.rules
    dest: /etc/udev/rules.d/98-local-8bitdo.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  tags: [hardware-tweaks, udev]

# ── IPv6 ─────────────────────────────────────────────────────────────────────
# The EdgeRouter advertises a ULA prefix (fd84:dede:.../64) over Router
# Advertisements on the LAN, so this host autoconfigures a "global-looking"
# IPv6 address even though there's no actual IPv6 default route -- confirmed
# via `ip -6 route show default` (empty) and a raw connect to any real global
# IPv6 address failing immediately with "Network is unreachable", not a
# timeout. Same ULA already broke Moonlight discovery once (see
# roles/sunshine's avahi use-ipv6=no task) because avahi/moonlight-qt
# preferred the unreachable ULA over IPv4. Because a non-link-local IPv6
# address is present at all, glibc's getaddrinfo (AI_ADDRCONFIG) and browser
# Happy-Eyeballs logic both treat IPv6 as viable and try every AAAA record a
# site returns (e.g. 8 for google.com) before falling back to IPv4 -- each
# attempt fails fast, but across the many third-party domains a real page
# loads, it compounds into real, user-visible page-load slowness (measured
# 2026-09-07: ~30% slower dual-stack vs IPv4-only across 10 typical
# subresource domains). Disabling IPv6 on the wired connection removes the
# ULA address entirely, so getaddrinfo skips AAAA lookups and every
# connection goes straight to IPv4. Scoped to archlinux only -- this host has
# no real upstream IPv6 to lose either way; not assuming the same is true for
# other cachyos_workstations members (e.g. lemurpro) without checking.
#
# nmcli connection show/modify take the connection *name* (e.g. "Wired
# connection 1"), not the interface/device name -- resolved dynamically the
# same way playbooks/infrastructure/set-static-ip.yml does, rather than
# assuming a name, since it's just a NetworkManager-generated default that
# could differ or get renamed.
- name: Get active NetworkManager connections
  ansible.builtin.command:
    cmd: nmcli -t -f NAME,DEVICE connection show --active
  register: archlinux_nm_active_connections
  changed_when: false
  when: inventory_hostname == 'archlinux'
  tags: [hardware-tweaks, network, ipv6]

- name: Identify the active connection profile on the default interface
  ansible.builtin.set_fact:
    archlinux_nm_conn_name: >-
      {{ (archlinux_nm_active_connections.stdout_lines
          | select('search', ':' + ansible_facts.default_ipv4.interface + '$')
          | list | first).split(':')[0] }}
  when: inventory_hostname == 'archlinux'
  tags: [hardware-tweaks, network, ipv6]

- name: Get current ipv6.method on that connection
  ansible.builtin.command:
    cmd: nmcli -g ipv6.method connection show "{{ archlinux_nm_conn_name }}"
  register: archlinux_ipv6_method_current
  changed_when: false
  when: inventory_hostname == 'archlinux'
  tags: [hardware-tweaks, network, ipv6]

- name: Disable IPv6 on the wired connection
  ansible.builtin.command:
    cmd: nmcli connection modify "{{ archlinux_nm_conn_name }}" ipv6.method disabled
  when:
    - inventory_hostname == 'archlinux'
    - archlinux_ipv6_method_current.stdout | default('') != 'disabled'
  register: archlinux_ipv6_disabled
  tags: [hardware-tweaks, network, ipv6]

- name: Reapply the wired connection so the IPv6 change takes effect
  ansible.builtin.command:
    cmd: nmcli connection up "{{ archlinux_nm_conn_name }}"
  when:
    - inventory_hostname == 'archlinux'
    - archlinux_ipv6_disabled is changed
  changed_when: false
  tags: [hardware-tweaks, network, ipv6]
