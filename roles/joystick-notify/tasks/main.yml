---
# Role: joystick-notify
# Controller-driven couch mode automation for KDE Plasma.
# Installed as a real package (packaging/PKGBUILD, makepkg -si) built from a
# fresh clone of the joystick-notify repo (ref: joystick_notify_repo_version,
# default main — see group_vars/cachyos_workstations.yml) on the target host —
# same pattern the sunshine role uses for its AUR install. Ships exactly two
# systemd user units: joystick-notify.service (daemon) and
# joystick-notify-tray.service (tray icon).

# ── Source ───────────────────────────────────────────────────────────────────

- name: Clone/update joystick-notify source ({{ joystick_notify_repo_version }})
  ansible.builtin.git:
    repo: "{{ joystick_notify_repo }}"
    dest: "{{ joystick_notify_src_dir }}"
    version: "{{ joystick_notify_repo_version }}"
    force: false
  become: false
  tags: [joystick-notify, build]

# ── Build + install (makepkg -si) ───────────────────────────────────────────

# pkgver/pkgrel are static (0.1.0-1, not derived from git -- see PKGBUILD)
# and this dir keeps whatever .pkg.tar.zst makepkg last produced. Found
# live 2026-08-30: `-si --needed` silently no-opped a real deploy --
# makepkg saw the existing build artifact and skipped rebuilding, then
# pacman's --needed saw the same installed version and skipped
# reinstalling, so a git pull of new commits (PR #26) built cleanly on
# the surface but never actually reached the running package at all.
# `-f` forces a rebuild regardless of an existing artifact; dropping
# --needed makes pacman -U install the freshly-built package regardless
# of whether its version string happens to match what's already
# installed. Correct for this PKGBUILD's own stated purpose ("the
# day-to-day install/test loop during this rewrite") -- every run of
# this tag is supposed to mean "deploy whatever main currently is."
- name: Build and install joystick-notify package
  ansible.builtin.shell: |
    set -euo pipefail
    makepkg -sfi --noconfirm
  args:
    chdir: "{{ joystick_notify_src_dir }}/packaging"
    executable: /bin/bash
  become: false
  register: jn_makepkg_result
  changed_when: "'-U ' in jn_makepkg_result.stdout or 'installing joystick-notify' in jn_makepkg_result.stdout or 'upgrading joystick-notify' in jn_makepkg_result.stdout or 'reinstalling' in jn_makepkg_result.stdout"
  tags: [joystick-notify, build]

# ── Systemd user units (shipped by the package at /usr/lib/systemd/user/) ──
# Earlier iterations (v1, and a stopgap hand-templated v2 unit) left
# per-user overrides in ~/.config/systemd/user/, which systemd resolves
# *ahead of* /usr/lib/systemd/user/ — meaning the package's real shipped
# units would be silently shadowed by stale content. None of these v1
# concepts (steam-shutdown path/service) exist in the v2 package at all.

- name: Remove stale per-user systemd unit overrides
  ansible.builtin.file:
    path: "{{ cachyos_user_home }}/.config/systemd/user/{{ item }}"
    state: absent
  become: false
  loop:
    - joystick-notify.service
    - joystick-notify-tray.service
    - joystick-notify-steam-shutdown.service
    - joystick-notify-steam-shutdown.path
  register: jn_stale_units_removed
  tags: [joystick-notify, service]

# Found live 2026-08-30: deleting the override files above doesn't clean
# up graphical-session.target.wants/ symlinks that were pointing at them
# -- they're left dangling. That didn't break anything that day (systemd
# still resolved the real packaged unit at /usr/lib/systemd/user/ despite
# the dangling .wants/ entry of the same name), and a later "Enable"
# task's own `systemctl enable` call has since been observed to silently
# repair it -- but that's incidental, not guaranteed idempotent behavior.
# Explicit cleanup here closes the actual gap instead of relying on that.
- name: Check graphical-session.target.wants symlinks for these units
  ansible.builtin.stat:
    path: "{{ cachyos_user_home }}/.config/systemd/user/graphical-session.target.wants/{{ item }}"
    follow: true
  become: false
  loop:
    - joystick-notify.service
    - joystick-notify-tray.service
  register: jn_wants_symlink_stat
  tags: [joystick-notify, service]

- name: Remove dangling graphical-session.target.wants symlinks
  ansible.builtin.file:
    path: "{{ cachyos_user_home }}/.config/systemd/user/graphical-session.target.wants/{{ item.item }}"
    state: absent
  become: false
  loop: "{{ jn_wants_symlink_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists
  tags: [joystick-notify, service]

- name: Ensure user lingering so systemd user instance runs without active login
  ansible.builtin.command: loginctl enable-linger {{ cachyos_user }}
  changed_when: false
  tags: [joystick-notify, service]

- name: Wait for user systemd bus socket
  ansible.builtin.wait_for:
    path: "/run/user/{{ cachyos_user_uid }}/bus"
    timeout: 10
  become: false
  tags: [joystick-notify, service]

- name: Reload user systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [joystick-notify, service]

- name: Enable joystick-notify.service
  ansible.builtin.systemd:
    name: joystick-notify.service
    enabled: true
    # A plain package upgrade (jn_makepkg_result.changed) must restart the
    # service too, not just the one-time stale-unit-override cleanup --
    # otherwise `state: started` on an already-running unit is a no-op and
    # a rebuilt package with real code changes silently never takes effect
    # despite the playbook reporting a successful upgrade.
    state: "{{ 'restarted' if (jn_stale_units_removed.changed or jn_makepkg_result.changed) else 'started' }}"
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [joystick-notify, service, daemon]

- name: Enable joystick-notify-tray.service
  ansible.builtin.systemd:
    name: joystick-notify-tray.service
    enabled: true
    state: "{{ 'restarted' if (jn_stale_units_removed.changed or jn_makepkg_result.changed) else 'started' }}"
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [joystick-notify, service, tray]

# ── CEC (pulse8-cec-attach) ──────────────────────────────────────────────────
# pulse8-cec-attach@.service ships with the package (system scope) and is
# started directly by udev via SYSTEMD_WANTS — it has no [Install] section,
# so there's nothing to "enable"; it only needs to not be masked. It was
# masked system-wide during the 2026-08-28 bisection
# (/etc/systemd/system/pulse8-cec-attach@.service -> /dev/null) and never
# unmasked, which is why /dev/cec0 has been missing since.

- name: Unmask pulse8-cec-attach@.service
  ansible.builtin.systemd:
    name: pulse8-cec-attach@.service
    masked: false
  become: true
  register: jn_cec_unmasked
  tags: [joystick-notify, cec]

- name: Retrigger udev tty add so the already-attached CEC adapter is picked up
  ansible.builtin.command: udevadm trigger --action=add --subsystem-match=tty
  become: true
  when: jn_cec_unmasked.changed
  changed_when: true
  tags: [joystick-notify, cec]

# cec0-configure.service (BindsTo=dev-cec0.device, no [Install]) does NOT
# auto-start on its own -- it's only started because a udev rule sets
# SYSTEMD_WANTS=cec0-configure.service when /dev/cec0 appears. Untracked v1
# leftover rule files in /etc/udev/rules.d/ (no "joystick-notify-" filename
# prefix, predating the v2 package) sort after the package's namespaced
# 70-joystick-notify-cec-configure-autostart.rules and silently overwrite
# SYSTEMD_WANTS with the old v1 template unit name
# (cec0-configure@card1-HDMI-A-1.service, which no longer exists in v2 and
# is masked dead weight) -- confirmed live 2026-08-29 via `udevadm info
# /dev/cec0` showing the stale value, which left the adapter completely
# unconfigured (`cec-ctl -S` reported phys addr f.f.f.f, no logical address
# claimed) despite pulse8-cec-attach@ running fine.

- name: Remove untracked v1 udev rule leftovers shadowing the packaged CEC rules
  ansible.builtin.file:
    path: "/etc/udev/rules.d/{{ item }}"
    state: absent
  become: true
  loop:
    - cec-configure-autostart.rules
    - pulse8-cec-autoattach.rules
    - 98-cec-fixup.rules
  register: jn_stale_udev_rules_removed
  tags: [joystick-notify, cec]

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  become: true
  when: jn_stale_udev_rules_removed.changed
  changed_when: true
  tags: [joystick-notify, cec]

- name: Retrigger cec0 add so it picks up the corrected SYSTEMD_WANTS and actually configures
  ansible.builtin.command: udevadm trigger --action=add --subsystem-match=cec
  become: true
  when: jn_stale_udev_rules_removed.changed
  changed_when: true
  tags: [joystick-notify, cec]

# cec0-configure.service runs at system scope (triggered by udev, no login
# session), so config.py's Path.home() resolves to /root, not the real
# user's home -- it silently reads a nonexistent /root/.config/joystick-notify
# config, gets schema defaults (cec.enabled=False), and exits early with
# "CEC disabled or couch port not configured, skipping" even though the
# real config.toml has cec.enabled=true and a couch_port set. Confirmed live
# 2026-08-29: fixing the udev SYSTEMD_WANTS mismatch above made the service
# actually run, but it still no-op'd until this override was added. A
# systemd drop-in (not a packaging-level fix) because this HOME value is
# host-specific -- the package itself stays single-user-agnostic.

- name: Ensure cec0-configure.service.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/cec0-configure.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [joystick-notify, cec]

- name: Deploy cec0-configure.service.d HOME override
  ansible.builtin.template:
    src: cec0-configure-override.conf.j2
    dest: /etc/systemd/system/cec0-configure.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  register: jn_cec0_configure_override
  tags: [joystick-notify, cec]

- name: Reload system systemd daemon (cec0-configure.service.d override)
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: jn_cec0_configure_override.changed
  tags: [joystick-notify, cec]

- name: Re-run cec0-configure.service now that HOME is correct
  ansible.builtin.systemd:
    name: cec0-configure.service
    state: restarted
  become: true
  when: jn_cec0_configure_override.changed
  tags: [joystick-notify, cec]

# ── logind shutdown-inhibitor delay (for shutdown_watcher.py) ──────────────
# Deploy-only, deliberately no live `systemctl restart systemd-logind`
# here -- a config-file change alone is picked up by the next real
# logind start (i.e. the next reboot), which this feature needs a reboot
# to verify anyway. Restarting logind live is safe in practice (it
# doesn't drop active sessions), but there's no reason to take even a
# low-risk live action on a system service when the verification step
# already requires a reboot.

- name: Ensure /etc/systemd/logind.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [joystick-notify, shutdown]

- name: Deploy logind shutdown-inhibitor delay drop-in
  ansible.builtin.template:
    src: logind-shutdown-inhibit.conf.j2
    dest: /etc/systemd/logind.conf.d/joystick-notify-shutdown-inhibit.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [joystick-notify, shutdown]

# ── Legacy pre-v2 desk-primary-enforcement subsystem ─────────────────────────
# See tasks/legacy-desk-primary.yml for the full history/rationale.

- name: Manage legacy desk-primary-enforcement subsystem
  ansible.builtin.include_tasks: legacy-desk-primary.yml
  tags: [joystick-notify, legacy-desk-primary]
