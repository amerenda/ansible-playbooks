---
# Role: k3s-agent
# Installs k3s binary via official script, writes config.yaml, enables agent service.
# k3s_token must be set as a hostvars fact (fetched from BWS by the fetch-secrets play).

- name: Check if k3s binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary_stat
  tags: [k3s-agent]

- name: Install k3s via official installer (agent-only mode)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ cachyos_k3s_version }}" \
      INSTALL_K3S_EXEC="agent" \
      INSTALL_K3S_SKIP_START=true \
      sh -
  args:
    executable: /bin/bash
  when: not k3s_binary_stat.stat.exists
  tags: [k3s-agent]

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k3s-agent]

- name: Write k3s agent config.yaml
  ansible.builtin.template:
    src: k3s-agent-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s-agent
  tags: [k3s-agent, config]

# --- containerd meta.db SSD split (only when k3s_agent_containerd_meta_ssd_dir is set) ---
# See roles/k3s-agent/defaults/main.yml for why this exists, and
# templates/containerd-config.toml.tmpl.j2 for full background.

- name: Ensure containerd data directory exists (for meta.db SSD split)
  ansible.builtin.file:
    path: "{{ k3s_agent_data_dir }}/agent/containerd/io.containerd.metadata.v1.bolt"
    state: directory
    owner: root
    group: root
    mode: "0711"
  when: k3s_agent_containerd_meta_ssd_dir | length > 0
  tags: [k3s-agent, containerd, storage]

- name: Ensure containerd config directory exists (for config.toml.tmpl override)
  ansible.builtin.file:
    path: "{{ k3s_agent_data_dir }}/agent/etc/containerd"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: k3s_agent_containerd_meta_ssd_dir | length > 0
  tags: [k3s-agent, containerd, config]

- name: Ensure SSD-side containerd metadata directory exists
  ansible.builtin.file:
    path: "{{ k3s_agent_containerd_meta_ssd_dir }}/io.containerd.metadata.v1.bolt"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: k3s_agent_containerd_meta_ssd_dir | length > 0
  tags: [k3s-agent, containerd, storage]

- name: Check current state of containerd meta.db on the data-dir volume
  ansible.builtin.stat:
    path: "{{ k3s_agent_data_dir }}/agent/containerd/io.containerd.metadata.v1.bolt/meta.db"
  register: k3s_agent_meta_db_stat
  when: k3s_agent_containerd_meta_ssd_dir | length > 0
  tags: [k3s-agent, containerd, storage]

- name: One-time migration — move an existing meta.db to SSD before symlinking
  when:
    - k3s_agent_containerd_meta_ssd_dir | length > 0
    - k3s_agent_meta_db_stat.stat.exists | default(false)
    - not (k3s_agent_meta_db_stat.stat.islnk | default(false))
  tags: [k3s-agent, containerd, storage]
  block:
    - name: Stop k3s-agent before touching a live meta.db
      ansible.builtin.systemd:
        name: k3s-agent
        state: stopped

    - name: Copy existing meta.db to its new SSD home
      ansible.builtin.command:
        cmd: >-
          cp --preserve=all
          {{ k3s_agent_data_dir }}/agent/containerd/io.containerd.metadata.v1.bolt/meta.db
          {{ k3s_agent_containerd_meta_ssd_dir }}/io.containerd.metadata.v1.bolt/meta.db
        creates: "{{ k3s_agent_containerd_meta_ssd_dir }}/io.containerd.metadata.v1.bolt/meta.db"

    - name: Remove the original meta.db now that it's safely copied
      ansible.builtin.file:
        path: "{{ k3s_agent_data_dir }}/agent/containerd/io.containerd.metadata.v1.bolt/meta.db"
        state: absent

- name: Symlink containerd meta.db to its SSD home
  ansible.builtin.file:
    src: "{{ k3s_agent_containerd_meta_ssd_dir }}/io.containerd.metadata.v1.bolt/meta.db"
    dest: "{{ k3s_agent_data_dir }}/agent/containerd/io.containerd.metadata.v1.bolt/meta.db"
    state: link
    force: true
  when: k3s_agent_containerd_meta_ssd_dir | length > 0
  notify: Restart k3s-agent
  tags: [k3s-agent, containerd, storage]

- name: Deploy containerd config.toml.tmpl override (grpc size bump + meta.db SSD split)
  ansible.builtin.template:
    src: containerd-config.toml.tmpl.j2
    dest: "{{ k3s_agent_data_dir }}/agent/etc/containerd/config.toml.tmpl"
    owner: root
    group: root
    mode: "0644"
  when: k3s_agent_containerd_meta_ssd_dir | length > 0
  notify: Restart k3s-agent
  tags: [k3s-agent, containerd, config]

- name: Enable and start k3s-agent service
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true
  tags: [k3s-agent, service]
