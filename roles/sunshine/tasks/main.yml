---
# Role: sunshine
# Sunshine game stream host (AUR) — VA-API/KWin capture on AMD Wayland desktop.
# Installs package, scripts, config, and enables user service.

# ── Dependencies ───────────────────────────────────────────────────────────────

- name: Add user to input and realtime groups (Sunshine needs /dev/input access and priority scheduling)
  ansible.builtin.user:
    name: "{{ cachyos_user }}"
    groups:
      - input
      - realtime
    append: true
  tags: [sunshine, groups]

- name: Allow Sunshine encoding threads to reach nice -15 (override realtime group's -11 cap)
  ansible.builtin.copy:
    content: |
      # Allow {{ cachyos_user }} to set process priority as low as nice -20.
      # Sunshine's encoding threads request nice -15; the realtime group only allows -11.
      {{ cachyos_user }} - nice -20
    dest: /etc/security/limits.d/91-sunshine-nice.conf
    owner: root
    group: root
    mode: "0644"
  tags: [sunshine, groups]

- name: Install sunshine from AUR
  ansible.builtin.shell: |
    set -euo pipefail
    paru -S --noconfirm --needed sunshine
  args:
    executable: /bin/bash
  become: false
  register: sunshine_aur_result
  changed_when: "'there is nothing to do' not in sunshine_aur_result.stdout"
  tags: [sunshine, aur]

# ── Scripts ────────────────────────────────────────────────────────────────────
# v1's standalone unlock scripts (couch-mode-screen-unlock.sh,
# screen-lock-inhibit-daemon.sh, launch-bigpicture.sh, etc.) were removed
# wholesale in the joystick-notify v2 rewrite. sunshine-unlock-prep.sh/
# -undo.sh are now thin wrappers around the v2 daemon's own wizard API
# (POST /api/screen/unlock|/lock) -- screen unlock/inhibit ONLY, the same
# screen_lock.py mechanism a controller connect uses, deliberately NOT
# the full couch-mode transition (no CEC TV/receiver wake, no physical
# display/audio switch) -- a Sunshine stream is often remote (Steam Deck,
# not the couch), so it has no business waking hardware nobody's in
# front of. Steam Big Picture still launches via the daemon's own
# config.on_connect (already set to "steam-bigpicture" on this host,
# fires on any couch-mode entry) -- see joystick-notify PR #33.

- name: Remove stale pre-rename script leftovers (sunshine-couch-*.sh)
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - sunshine-couch-prep.sh
    - sunshine-couch-undo.sh
  tags: [sunshine, scripts]

- name: Install sunshine prep/undo scripts from joystick-notify repo
  ansible.builtin.copy:
    src: "{{ cachyos_joystick_notify_src }}/sunshine/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - sunshine-unlock-prep.sh
    - sunshine-unlock-undo.sh
    # Per-app prep-cmd for the "Steam Big Picture" apps.json entry only
    # (not the global hook above) -- see joystick-notify PR #33.
    - sunshine-launch-steam-bigpicture.sh
  tags: [sunshine, scripts]

# ── API token (Sunshine -> joystick-notify wizard auth) ────────────────────────
# sunshine_api_token is passed as an extra-var (-e), sourced from BWS
# secret joystick-notify-dean-sunshine-api-token -- deliberately NOT
# fetched via fetch-secrets.yml/bws_secrets (that play only targets
# localhost and needs bws_access_token; this role is routinely run
# --limit archlinux alone). Idempotent: installing the same token twice
# produces the same working state each time.

- name: Require sunshine_api_token
  ansible.builtin.assert:
    that:
      - sunshine_api_token is defined
      - sunshine_api_token | length > 0
    fail_msg: >-
      sunshine_api_token is required (BWS secret
      joystick-notify-dean-sunshine-api-token) -- pass with
      -e sunshine_api_token=<value>
  tags: [sunshine, api-token]

- name: Write the API token where sunshine-couch-prep.sh/-undo.sh read it
  ansible.builtin.copy:
    content: "{{ sunshine_api_token }}"
    dest: "{{ cachyos_user_home }}/.config/joystick-notify/sunshine-api-token"
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0600"
  become: false
  no_log: true
  tags: [sunshine, api-token]

- name: Install the token's hash into the joystick-notify daemon
  ansible.builtin.command: jn-daemon --install-api-token {{ sunshine_api_token }}
  become: false
  changed_when: false
  no_log: true
  tags: [sunshine, api-token]

# Virtual-display scripts — see roles/sunshine/files/sunshine-display-backend.sh
# for why: Sunshine's dd_resolution_option automatic resolution switching does
# not work under capture=kwin (confirmed via zero display-device log activity
# during a live session — the physical output never actually resized). A
# krfb-virtualmonitor output created at the client's requested resolution and
# captured directly sidesteps the issue entirely, and applies uniformly to
# every app/client (Steam Deck, 4K TV, bedroom TV) since Sunshine's capture
# target is a single global setting, not per-app.
- name: Install sunshine virtual-display scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - sunshine-display-backend.sh
    - sunshine-vdisplay-connect.sh
    - sunshine-vdisplay-disconnect.sh
  tags: [sunshine, scripts]

# cursor-stream-hide/show scripts — install only if present in the repo
- name: Install cursor-stream scripts if present in sunshine dir
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item | basename }}"
    owner: root
    group: root
    mode: "0755"
  with_fileglob:
    - "{{ cachyos_joystick_notify_src }}/sunshine/cursor-stream-*.sh"
  tags: [sunshine, scripts]

# ── Config ─────────────────────────────────────────────────────────────────────

- name: Ensure ~/.config/sunshine exists
  ansible.builtin.file:
    path: "{{ cachyos_user_home }}/.config/sunshine"
    state: directory
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0755"
  become: false
  tags: [sunshine, config]

- name: Install sunshine.conf
  ansible.builtin.template:
    src: sunshine.conf.j2
    dest: "{{ cachyos_user_home }}/.config/sunshine/sunshine.conf"
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0644"
  become: false
  notify: Restart sunshine service
  tags: [sunshine, config]

- name: Install sunshine apps.json
  ansible.builtin.copy:
    src: apps.json
    dest: "{{ cachyos_user_home }}/.config/sunshine/apps.json"
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0644"
  become: false
  notify: Restart sunshine service
  tags: [sunshine, config]

# ── Firewall (UFW) ────────────────────────────────────────────────────────────

- name: Allow Sunshine TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: "Sunshine streaming"
  loop:
    - "47984"   # HTTPS
    - "47989"   # HTTP
    - "47990"   # web UI
    - "48010"   # RTSP
  tags: [sunshine, ufw]

- name: Allow Sunshine UDP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
    comment: "Sunshine streaming"
  loop:
    - "47998"   # video
    - "47999"   # control
    - "48000"   # audio
    - "48002"   # input
    - "48010"   # mic
  tags: [sunshine, ufw]

# ── Udev / cap_sys_admin ───────────────────────────────────────────────────────

- name: Add udev rule so Sunshine can access /dev/uinput without root
  ansible.builtin.copy:
    content: |
      KERNEL=="uinput", GROUP="input", MODE="0660", OPTIONS+="static_node=uinput"
    dest: /etc/udev/rules.d/85-sunshine-uinput.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules
  tags: [sunshine, udev]

# ── Service ────────────────────────────────────────────────────────────────────

- name: Enable user lingering so systemd user instance runs without active login
  ansible.builtin.command: loginctl enable-linger {{ cachyos_user }}
  changed_when: false
  tags: [sunshine, service]

- name: Wait for user systemd bus socket
  ansible.builtin.wait_for:
    path: "/run/user/{{ cachyos_user_uid }}/bus"
    timeout: 10
  become: false
  tags: [sunshine, service]

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [sunshine, service]

- name: Enable and start sunshine user service
  ansible.builtin.systemd:
    # The AUR sunshine package ships app-dev.lizardbyte.app.Sunshine.service, not
    # sunshine.service — verified via `pacman -Ql sunshine | grep systemd`.
    name: app-dev.lizardbyte.app.Sunshine.service
    enabled: true
    state: started
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [sunshine, service]

# ── Handlers ───────────────────────────────────────────────────────────────────
# (inline — handlers not supported in role tasks list directly; use notify target)
