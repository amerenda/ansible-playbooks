---
# Role: moondeck
# MoonDeckBuddy — paired HTTPS+WebSocket companion queried by the MoonDeck
# SteamDeck plugin for Steam/PC state and control (NOT a Sunshine hook —
# see Areas/Archlinux/notes/joystick-notify-sunshine-reenable-phase3-notes.md
# in the Dean Obsidian vault for the full research). The actual game stream
# is still a Sunshine stream (MoonDeck adds its own apps.json entry running
# MoonDeckStream), so Sunshine's existing global_prep_cmd already covers
# screen unlock for MoonDeck-launched games — this role does not need to
# wire anything to joystick-notify's wizard API.
#
# Installed via AUR (moondeckbuddy-appimage, in cachyos_aur_packages — see
# roles/desktop-apps for the paru install loop) into /usr/bin/MoonDeckBuddy
# and /usr/bin/MoonDeckStream.
#
# This role wires up the gamescope wrapper script and the systemd --user
# service. MoonDeckBuddy binds :59999 — nothing launches it, so it needs its
# own autostart, handled here rather than a manual per-shell launch (which
# is fragile: a long-lived shell's DISPLAY/XAUTHORITY go stale across
# compositor restarts, but systemd --user always has the current session's
# env).
#
# Headless by default (NO_GUI=true, matching the wiki's documented headless
# mode) bound to default.target, not graphical-session.target — the paired
# REST/WS API needs no display. MOONDECKBUDDY_NO_GUI is overridable via the
# unit's environment for a one-off GUI/systray run (only needed to show the
# PIN dialog when pairing a *new* client — pairing is a manual, occasional
# action, not something this role automates). This mirrors the config
# already live-tested on archlinux since 2026-07 (one client already
# paired, confirmed via ~/.config/moondeckbuddy/clients.json) — the
# previous version of this task rendered a GUI-session-bound unit that was
# never actually what got deployed; this reconciles the drift.

- name: Remove legacy /opt/moondeck raw-AppImage install (superseded by AUR package)
  ansible.builtin.file:
    path: /opt/moondeck
    state: absent
  tags: [moondeck]

- name: Remove legacy /opt/moondeck PATH entry
  ansible.builtin.file:
    path: /etc/profile.d/moondeck.sh
    state: absent
  tags: [moondeck]

- name: Install gamescope wrapper script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      MONITOR="HDMI-A-1"   # dummy
      exec gamescope -O "$MONITOR" -- "$@"
    dest: /usr/local/bin/moondeck-gamescope.sh
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0755"
  tags: [moondeck]

# ── Service ────────────────────────────────────────────────────────────────────

- name: Install moondeckbuddy systemd --user unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=MoonDeck host companion
      After=default.target

      [Service]
      Type=exec
      ExecStart=/bin/sh -c 'NO_GUI="${MOONDECKBUDDY_NO_GUI:-true}" /usr/bin/MoonDeckBuddy'
      Restart=on-failure
      RestartSec=10
      SuccessExitStatus=143

      [Install]
      WantedBy=default.target
    dest: "{{ cachyos_user_home }}/.config/systemd/user/moondeckbuddy.service"
    owner: "{{ cachyos_user }}"
    group: "{{ cachyos_user }}"
    mode: "0644"
  become: false
  notify: Restart moondeckbuddy service
  tags: [moondeck, service]

- name: Enable user lingering so systemd user instance runs without active login
  ansible.builtin.command: loginctl enable-linger {{ cachyos_user }}
  changed_when: false
  tags: [moondeck, service]

- name: Wait for user systemd bus socket
  ansible.builtin.wait_for:
    path: "/run/user/{{ cachyos_user_uid }}/bus"
    timeout: 10
  become: false
  tags: [moondeck, service]

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [moondeck, service]

- name: Enable and start moondeckbuddy user service
  ansible.builtin.systemd:
    name: moondeckbuddy.service
    enabled: true
    state: started
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ cachyos_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ cachyos_user_uid }}/bus"
  tags: [moondeck, service]

# ── Firewall (UFW) ────────────────────────────────────────────────────────────

- name: Allow MoonDeckBuddy TCP port through UFW
  community.general.ufw:
    rule: allow
    port: "59999"
    proto: tcp
    comment: "MoonDeckBuddy"
  tags: [moondeck, ufw]
