---
# Role: desktop-apps
# AUR desktop applications: VSCode, Cursor, Dropbox, NordPass, NordVPN, amdgpu_top.
# Firefox and Bitwarden are in cachyos_pacman_packages (installed by common role).

- name: Check KVM is available (required by WinBoat; enabled in BIOS/UEFI, not installable)
  ansible.builtin.stat:
    path: /dev/kvm
  register: desktop_apps_kvm_check
  tags: [desktop-apps, aur, winboat]

- name: Warn if KVM is unavailable (WinBoat will not work until virtualization is enabled in BIOS/UEFI)
  ansible.builtin.debug:
    msg: "WARNING: /dev/kvm not found. WinBoat requires KVM virtualization enabled in BIOS/UEFI — enable it, then re-run this role."
  when: not desktop_apps_kvm_check.stat.exists
  tags: [desktop-apps, aur, winboat]

# 2026-08-28: WinBoat's Windows VM container was found running continuously
# (9 days uptime, ~28% CPU) despite nobody actively using it, and restarting
# itself after a reboot even though its own docker restart-policy is
# "on-failure" (not "always") -- something else, likely Plasma's session
# restore relaunching the WinBoat GUI app, was starting it back up. Rather
# than chase that exact relaunch mechanism, this task just converges the
# container to stopped on every ansible run, which is enough to satisfy
# "should not run unless Alex explicitly starts it".
- name: Ensure WinBoat container is stopped (not needed unless explicitly launched)
  ansible.builtin.command: /usr/bin/docker stop WinBoat
  register: desktop_apps_winboat_stop
  changed_when: "'WinBoat' in desktop_apps_winboat_stop.stdout"
  failed_when: false
  tags: [desktop-apps, winboat]

- name: Install AUR desktop applications
  ansible.builtin.shell: |
    set -euo pipefail
    paru -S --noconfirm --needed {{ item }}
  args:
    executable: /bin/bash
  become: false
  register: desktop_apps_aur_result
  changed_when: "'there is nothing to do' not in desktop_apps_aur_result.stdout"
  loop: "{{ cachyos_aur_packages }}"
  tags: [desktop-apps, aur]

- name: Enable Dropbox user service
  ansible.builtin.systemd:
    name: dropbox
    enabled: true
    state: started
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"
  failed_when: false
  tags: [desktop-apps, dropbox]
