---
# TCP Port Exhaustion Mitigation for mac-mini-m4
#
# Stopgap for INC-2026-09-07: a connection-flood (mostly loopback/self
# traffic, cause not yet identified — see the Obsidian incident note and
# Areas/Mac Mini/Plans/tcp-port-exhaustion-mitigation.md Phase 3) drove
# mac-mini-m4's entire ephemeral port range (49152-65535, 16383 ports) into
# TIME_WAIT, blocking every new outbound TCP connection host-wide,
# including Komodo's git fetch of komodo-dean-gitops.
#
# This does NOT fix the flood's source — it only buys headroom (~4x more
# ephemeral ports, 3x faster TIME_WAIT drain) so a repeat of the same flood
# rate takes longer to exhaust the range, and so the range recovers faster
# once the flood stops. Root-causing the actual offending process is a
# separate, still-open follow-up.
#
# Applies at runtime via `sysctl -w` (effective immediately, no reboot) and
# persists across reboots via /etc/sysctl.conf, matching the existing
# net.inet.ip.forwarding pattern for this host in setup-macmini.yml.
#
# Also installs the native com.local.tcp-textfile-exporter LaunchDaemon
# (component of komodo-dean-gitops PR #251) that feeds Prometheus the
# TCP-exhaustion alert added there — no containerized exporter can see
# macOS's real netinet stack, only a native process can (see that script's
# header comment). Requires the komodo-dean-gitops checkout on the Mini to
# already have that PR's files (git pull via the existing sync-stacks.sh
# LaunchDaemon, or a manual `git pull` if run ahead of that).
#
# Usage:
#   ansible-playbook -i inventory/inventory.ini playbooks/infrastructure/macmini-tcp-tuning.yml
#
# Idempotency check (run twice, second run should report changed=0 for the
# persistent-config and LaunchDaemon-install tasks, and unchanged sysctl
# values on verify):
#   ansible-playbook -i inventory/inventory.ini playbooks/infrastructure/macmini-tcp-tuning.yml
#   ansible-playbook -i inventory/inventory.ini playbooks/infrastructure/macmini-tcp-tuning.yml

- name: Mitigate TCP port exhaustion on mac-mini-m4
  hosts: macmini_hosts
  become: yes
  gather_facts: yes
  tags: [macmini, tcp-tuning]

  vars:
    target_user: "{{ ansible_user }}"
    compose_dir: "/Users/{{ target_user }}/komodo-dean-gitops"
    macmini_compose_dir: "{{ compose_dir }}/mac-mini-m4"
    tcp_textfile_dir: "/Users/{{ target_user }}/monitoring/textfile-collector"
    macmini_tcp_tuning_params:
      # Default 49152 (IANA dynamic/private floor) leaves only 16383
      # ephemeral ports. 32768 is the common BSD/Linux ephemeral floor and
      # roughly doubles the range to 32767 ports.
      net.inet.ip.portrange.first: 32768
      # Default 15000ms -> 30s TIME_WAIT (2*MSL). 5000ms -> 10s TIME_WAIT,
      # so exhausted ports free up 3x faster under sustained churn.
      net.inet.tcp.msl: 5000

  tasks:
    - name: Fail fast if targeting a non-macOS host
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Darwin'
        fail_msg: >-
          macmini-tcp-tuning.yml uses BSD/Darwin-only sysctl names
          (net.inet.*) and is only meant for macmini_hosts.
          {{ inventory_hostname }} reports os_family={{ ansible_facts['os_family'] }}.

    - name: Configure TCP tuning persistently via /etc/sysctl.conf
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: "^{{ item.key | regex_escape }}="
        line: "{{ item.key }}={{ item.value }}"
        create: yes
        owner: root
        group: wheel
        mode: '0644'
      loop: "{{ macmini_tcp_tuning_params | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      register: macmini_tcp_tuning_config

    - name: Apply TCP tuning immediately (runtime, no reboot required)
      ansible.builtin.command:
        cmd: "sysctl -w {{ item.key }}={{ item.value }}"
      loop: "{{ macmini_tcp_tuning_params | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      changed_when: false

    - name: Verify current sysctl values
      ansible.builtin.command:
        cmd: "sysctl {{ item.key }}"
      loop: "{{ macmini_tcp_tuning_params | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: macmini_tcp_tuning_verify
      changed_when: false

    - name: Show current values
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ macmini_tcp_tuning_verify.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Require tcp-exhaustion-textfile-exporter.sh in GitOps checkout
      ansible.builtin.stat:
        path: "{{ macmini_compose_dir }}/scripts/tcp-exhaustion-textfile-exporter.sh"
      register: tcp_textfile_script
      tags: [mini-tcp-monitoring]

    - name: Fail if tcp-exhaustion-textfile-exporter.sh is missing on the Mini
      ansible.builtin.fail:
        msg: >-
          Expected {{ macmini_compose_dir }}/scripts/tcp-exhaustion-textfile-exporter.sh
          (komodo-dean-gitops PR #251). Ensure {{ compose_dir }} exists and `git pull`
          has picked up that PR (via sync-stacks.sh, or manually) before re-running with
          --tags mini-tcp-monitoring.
      when: not tcp_textfile_script.stat.exists
      tags: [mini-tcp-monitoring]

    - name: Create textfile-collector directory (bind-mounted into node-exporter)
      ansible.builtin.file:
        path: "{{ tcp_textfile_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: staff
        mode: '0755'
      tags: [mini-tcp-monitoring]

    - name: Install tcp-textfile-exporter LaunchDaemon
      ansible.builtin.copy:
        src: "{{ macmini_compose_dir }}/launchd/com.local.tcp-textfile-exporter.plist"
        dest: /Library/LaunchDaemons/com.local.tcp-textfile-exporter.plist
        owner: root
        group: wheel
        mode: '0644'
        remote_src: yes
      tags: [mini-tcp-monitoring]

    # Unload first so a plist edit is always picked up (a plain `load` on an
    # already-loaded label is a no-op for the definition itself — same
    # lesson as slzb-proxy/ollama in setup-macmini.yml).
    - name: Restart tcp-textfile-exporter LaunchDaemon (force definition refresh)
      ansible.builtin.shell: |
        launchctl bootout system /Library/LaunchDaemons/com.local.tcp-textfile-exporter.plist 2>/dev/null || \
          launchctl unload /Library/LaunchDaemons/com.local.tcp-textfile-exporter.plist 2>/dev/null || true
        launchctl bootstrap system /Library/LaunchDaemons/com.local.tcp-textfile-exporter.plist 2>/dev/null || \
          launchctl load /Library/LaunchDaemons/com.local.tcp-textfile-exporter.plist
      changed_when: false
      tags: [mini-tcp-monitoring]

    - name: Wait for mac_mini_tcp.prom to be written
      ansible.builtin.wait_for:
        path: "{{ tcp_textfile_dir }}/mac_mini_tcp.prom"
        timeout: 60
      tags: [mini-tcp-monitoring]

    - name: Show current textfile-collector output
      ansible.builtin.command:
        cmd: "cat {{ tcp_textfile_dir }}/mac_mini_tcp.prom"
      register: tcp_textfile_output
      changed_when: false
      tags: [mini-tcp-monitoring]

    - name: Display textfile-collector output
      ansible.builtin.debug:
        msg: "{{ tcp_textfile_output.stdout_lines }}"
      tags: [mini-tcp-monitoring]
